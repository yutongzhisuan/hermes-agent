name: Headless wheel offline bundles

# Build platform-specific frozen + vendored offline bundles (one job per OS/arch).
# Not part of the PR gate — bundles are large (~350 MB/platform) and slow to produce.
#
# Triggers:
#   workflow_dispatch  — manual run (optionally single platform)
#   workflow_call      — reusable from other workflows (e.g. release automation)
#   release published  — attach bundles to GitHub Release assets

on:
  workflow_call:
    inputs:
      platform:
        description: Platform tag to build, or "all" for the full matrix
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: false
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x86_64
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: headless-wheel-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.9.28"

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          REQUESTED: ${{ inputs.platform || 'all' }}
        run: |
          python3 <<'PY'
          import json, os

          all_platforms = [
              {"platform": "macos-arm64", "runner": "macos-14", "rosetta": False},
              {"platform": "macos-x86_64", "runner": "macos-14", "rosetta": True},
              {"platform": "linux-x86_64", "runner": "ubuntu-latest", "rosetta": False},
              {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm", "rosetta": False},
              {"platform": "windows-x86_64", "runner": "windows-latest", "rosetta": False},
          ]
          requested = os.environ.get("REQUESTED", "all")
          if requested and requested != "all":
              selected = [p for p in all_platforms if p["platform"] == requested]
              if not selected:
                  raise SystemExit(f"Unknown platform: {requested}")
          else:
              selected = all_platforms
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'include': selected})}\n")
          PY

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.rosetta != true
        run: uv python install "${{ env.PYTHON_VERSION }}"

      - name: Set up Python ${{ env.PYTHON_VERSION }} (Rosetta)
        if: matrix.rosetta
        run: arch -x86_64 uv python install "${{ env.PYTHON_VERSION }}"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install dev dependencies
        if: matrix.rosetta != true
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev

      - name: Install dev dependencies (Rosetta)
        if: matrix.rosetta
        uses: ./.github/actions/retry
        with:
          command: arch -x86_64 uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev

      - name: Build offline bundles
        run: |
          if [ "${{ matrix.rosetta }}" = "true" ]; then
            echo "Building ${{ matrix.platform }} under Rosetta (arch -x86_64)..."
            arch -x86_64 env PYTHON=${{ env.PYTHON_VERSION }} scripts/build_offline_bundle.sh all
          else
            PYTHON=${{ env.PYTHON_VERSION }} scripts/build_offline_bundle.sh all
          fi

      - name: Smoke test frozen bundle
        run: |
          set -euo pipefail
          frozen="$(ls -1 dist/xhermes-agent-frozen-py${{ env.PYTHON_VERSION }}-${{ matrix.platform }}.tar.gz)"
          tmp="$(mktemp -d)"
          tar xzf "$frozen" -C "$tmp"
          root="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ "${{ matrix.rosetta }}" = "true" ]; then
            arch -x86_64 "$root/bin/xhermes" --version
          else
            "$root/bin/xhermes" --version
          fi

      - name: List artifacts
        run: |
          ls -lh dist/xhermes-agent-*-${{ matrix.platform }}.tar.gz

      - name: Upload platform bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-bundle-${{ matrix.platform }}
          path: |
            dist/xhermes-agent-frozen-py${{ env.PYTHON_VERSION }}-${{ matrix.platform }}.tar.gz
            dist/xhermes-agent-vendored-py${{ env.PYTHON_VERSION }}-${{ matrix.platform }}.tar.gz
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}
          if-no-files-found: error

  merge:
    name: Merge platform bundles
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: offline-bundle-*
          merge-multiple: true
          path: bundles

      - name: Summarize bundle sizes
        run: |
          ls -lh bundles/
          du -sh bundles/

      - name: Upload merged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-offline-bundles-all
          path: bundles/
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

  publish-release:
    name: Attach bundles to release
    needs: merge
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download merged bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: headless-offline-bundles-all
          path: bundles

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" bundles/* --clobber
