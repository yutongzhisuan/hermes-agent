name: Headless wheel offline bundles

# Build platform-specific offline bundles (one job per OS/arch).
# Triggers:
#   push to dev            — build frozen for the full matrix (artifacts only)
#   workflow_dispatch      — manual run; optional release_tag uploads to Release
#   release: published     — attach Frozen assets to that Release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: false
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x86_64
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
          - windows-arm64
      mode:
        description: Bundle kind to build
        required: false
        type: choice
        default: frozen
        options:
          - frozen
          - all
          - vendored
      release_tag:
        description: If set, create/update a GitHub Release and upload Frozen assets
        required: false
        type: string
        default: ""
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.9.28"

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      mode: ${{ steps.set-matrix.outputs.mode }}
      release_tag: ${{ steps.set-matrix.outputs.release_tag }}
    steps:
      - id: set-matrix
        env:
          # workflow_dispatch sets github.event.inputs.*; push/release leave them empty
          REQUESTED: ${{ github.event.inputs.platform || 'all' }}
          MODE: ${{ github.event.inputs.mode || 'frozen' }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          python3 <<'PY'
          import json, os

          all_platforms = [
              # macos-14 + Rosetta for x86_64 (macos-13 Intel runners are scarce)
              {"platform": "macos-arm64", "runner": "macos-14"},
              {"platform": "macos-x86_64", "runner": "macos-14"},
              {"platform": "linux-x86_64", "runner": "ubuntu-latest"},
              {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm"},
              {"platform": "windows-x86_64", "runner": "windows-latest"},
              {"platform": "windows-arm64", "runner": "windows-11-arm"},
          ]
          requested = os.environ.get("REQUESTED", "all")
          mode = os.environ.get("MODE", "frozen")
          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          if mode not in ("frozen", "vendored", "all"):
              raise SystemExit(f"Unknown mode: {mode}")
          if requested and requested != "all":
              selected = [p for p in all_platforms if p["platform"] == requested]
              if not selected:
                  raise SystemExit(f"Unknown platform: {requested}")
          else:
              selected = all_platforms
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'include': selected})}\n")
              fh.write(f"mode={mode}\n")
              fh.write(f"release_tag={release_tag}\n")
          PY

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install "${{ env.PYTHON_VERSION }}"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install dev dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev

      - name: Build offline bundles
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          OFFLINE_PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          build_cmd=(scripts/build_offline_bundle.sh "${MODE}")
          # Apple Silicon runner building Intel frozen: force Rosetta process tree.
          if [ "${{ matrix.platform }}" = "macos-x86_64" ] && [ "$(uname -m)" = "arm64" ]; then
            arch -x86_64 env OFFLINE_PLATFORM=macos-x86_64 PYTHON="${PYTHON}" \
              scripts/build_offline_bundle.sh "${MODE}"
          else
            "${build_cmd[@]}"
          fi

      - name: Smoke test frozen bundle
        if: needs.prepare.outputs.mode == 'frozen' || needs.prepare.outputs.mode == 'all'
        run: |
          set -euo pipefail
          frozen="$(ls -1 dist/xhermes-agent-frozen-py${{ env.PYTHON_VERSION }}-${{ matrix.platform }}.tar.gz)"
          tmp="$(mktemp -d)"
          tar xzf "$frozen" -C "$tmp"
          root="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ -z "$root" ]; then
            echo "ERROR: empty frozen bundle under ${tmp}" >&2
            exit 1
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Prefer cmd launcher; fall back to Git Bash launcher (more reliable on ARM64).
            if [ -f "$root/bin/xhermes.cmd" ]; then
              cmd.exe //c "$(cygpath -w "$root/bin/xhermes.cmd")" --version \
                || "$root/bin/xhermes" --version
            else
              "$root/bin/xhermes" --version
            fi
          else
            "$root/bin/xhermes" --version
          fi

      - name: List artifacts
        run: |
          ls -lh dist/xhermes-agent-*-${{ matrix.platform }}.tar.gz

      - name: Select upload paths
        id: upload-paths
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PY: ${{ env.PYTHON_VERSION }}
          PLAT: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          paths=()
          case "${MODE}" in
            frozen) paths+=("dist/xhermes-agent-frozen-py${PY}-${PLAT}.tar.gz") ;;
            vendored) paths+=("dist/xhermes-agent-vendored-py${PY}-${PLAT}.tar.gz") ;;
            all)
              paths+=(
                "dist/xhermes-agent-frozen-py${PY}-${PLAT}.tar.gz"
                "dist/xhermes-agent-vendored-py${PY}-${PLAT}.tar.gz"
              )
              ;;
            *) echo "Unknown mode: ${MODE}" >&2; exit 1 ;;
          esac
          for p in "${paths[@]}"; do
            test -f "$p" || { echo "missing artifact: $p" >&2; exit 1; }
          done
          {
            echo "paths<<EOF"
            printf '%s\n' "${paths[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload platform bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-bundle-${{ matrix.platform }}
          path: ${{ steps.upload-paths.outputs.paths }}
          retention-days: 14
          if-no-files-found: error

  merge:
    name: Merge platform bundles
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: offline-bundle-*
          merge-multiple: true
          path: bundles

      - name: Summarize bundle sizes
        run: |
          ls -lh bundles/
          du -sh bundles/

      - name: Upload merged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-offline-bundles-all
          path: bundles/
          retention-days: 14

  publish-release:
    name: Attach bundles to release
    needs: [prepare, merge]
    if: |
      always() &&
      needs.merge.result == 'success' &&
      (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && needs.prepare.outputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download merged bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: headless-offline-bundles-all
          path: bundles

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "ERROR: empty release tag" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --title "Frozen offline bundles ${TAG}" \
              --notes "Multi-platform Frozen (and optional vendored) headless offline bundles built by headless-wheel-offline.yml." \
              --latest=false
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          ls -lh bundles/
          gh release upload "${TAG}" bundles/* --clobber
