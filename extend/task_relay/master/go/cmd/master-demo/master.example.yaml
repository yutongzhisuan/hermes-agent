# Unified master config for master-demo:
#   master-demo --config master.example.yaml --goal "..."
#   MASTER_CONFIG=master.example.yaml master-demo --goal "..."
#
# String fields support ${ENV_VAR} expansion.

hub:
  # Omit both grpc_addr and jwt for local-only mode.
  grpc_addr: ${HUB_GRPC_ADDR}
  jwt: ${MASTER_JWT}
  session: master-demo
  # tls:
  #   ca_file: ${HUB_TLS_CA}
  #   cert_file: ${HUB_TLS_CERT}
  #   key_file: ${HUB_TLS_KEY}
  #   skip_hostname_verify: false

openai:
  api_key: ${OPENAI_API_KEY}
  model: clint
  base_url: ${OPENAI_BASE_URL}

agent:
  mode: deep # deep | react
  max_iterations: 20
  # instruction: ""
  disable_local_subagents: false
  disable_local_planner: false

log:
  level: debug # debug|info|warn|error|off
  json: false
  verbose: false

runtime:
  timeout: 2m

metrics:
  enabled: false
  # addr: ":9090"

tracing:
  enabled: false
  # otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}

mcpServers:
  _example:
    disabled: true
    command: echo
    args: ["mcp-example-disabled"]

  # webextend:
  #   type: http
  #   url: http://127.0.0.1:8000/mcp
  #   headers:
  #     Authorization: Bearer ${GATEWAY_API_KEY}

search:
  enabled: true
  # Per-capability backends. Leave empty to use the priority fallback.
  search_backend: ""
  extract_backend: ""
  backend: ""
  max_results: 5
  timeout_seconds: 30

  providers:
    # Legacy self-hosted Tavily-compatible gateway (matches older single-provider configs).
    gateway:
      base_url: http://100.118.227.59:8000
      api_key: 4a89ecd6295b5b95f29ec7e10e274fd74370980797714425
      timeout_seconds: 30

    # firecrawl:
    #   base_url: https://api.firecrawl.dev
    #   api_key: ${FIRECRAWL_API_KEY}
    #   timeout_seconds: 30

    # parallel:
    #   base_url: https://api.parallel.ai
    #   api_key: ${PARALLEL_API_KEY}
    #   timeout_seconds: 30

    # tavily:
    #   base_url: ${TAVILY_BASE_URL}
    #   api_key: ${TAVILY_API_KEY}
    #   search_depth: basic
    #   timeout_seconds: 30

    # perplexity:
    #   base_url: ${PERPLEXITY_BASE_URL}
    #   api_key: ${PERPLEXITY_API_KEY}
    #   timeout_seconds: 30

    # exa:
    #   base_url: https://api.exa.ai
    #   api_key: ${EXA_API_KEY}
    #   timeout_seconds: 30

    # searxng:
    #   base_url: http://localhost:8080
    #   timeout_seconds: 30

    # brave_free:
    #   base_url: https://api.search.brave.com
    #   api_key: ${BRAVE_SEARCH_API_KEY}
    #   timeout_seconds: 30

    # ddgs:
    #   base_url: https://html.duckduckgo.com
    #   timeout_seconds: 30

# Controlled shell execution (disabled by default).
exec:
  enabled: false   # 设为 true 启用 bash 工具
  default_backend: local
  policy:
    mode: deny_by_default
    allow_list: ["ls", "cat", "grep", "git status", "go test", "make"]
    deny_list: ["rm -rf", "sudo", "curl | sh"]
    approval_list: ["git push", "kubectl"]
    env_allow_keys: ["HOME", "GOPATH"]   # PATH/LD_*/BASH_ENV 等危险键由代码硬编码永远剥离，配置不生效
  limits:
    timeout_default: 60s
    timeout_max: 10m
    max_output_bytes: 1048576
  audit:
    path: ~/.task-relay/exec-audit.jsonl
