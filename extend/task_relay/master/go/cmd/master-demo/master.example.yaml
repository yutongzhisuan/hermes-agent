    #   timeout_seconds: 30

    # ddgs:
    #   base_url: https://html.duckduckgo.com
    #   timeout_seconds: 30

# Controlled shell execution (disabled by default).
exec:
  enabled: false   # 设为 true 启用 bash 工具
  default_backend: local
  policy:
    mode: deny_by_default
    allow_list: ["ls", "cat", "grep", "git status", "go test", "make"]
    deny_list: ["rm -rf", "sudo", "curl | sh"]
    approval_list: ["git push", "kubectl"]
    env_allow_keys: ["HOME", "GOPATH"]   # PATH/LD_*/BASH_ENV 等危险键由代码硬编码永远剥离，配置不生效
  limits:
    timeout_default: 60s
    timeout_max: 10m
    max_output_bytes: 1048576
  audit:
    path: ~/.task-relay/exec-audit.jsonl
  # approval: external approval service for approval_list commands (empty webhook_url = deny)
  approval:
    webhook_url: ""
    timeout_seconds: 120

# Controlled file operations (disabled by default).
file:
  enabled: false   # set true to enable view/write/edit/multiedit
  root: ""         # default: master working directory; ops confined here unless allow_paths grants absolute globs
  policy:
    allow_paths: []                 # relative globs; empty = everything under root allowed (deny_paths still applies)
    deny_paths: [".ssh/**", "**/*.pem", "**/.env", "**/id_rsa*"]
  limits:
    max_read_bytes: 1048576
    max_write_bytes: 1048576

# Web fetch/download tools with SSRF guard and domain policy (disabled by default).
# Download destinations are gated by the file policy root when file.root is set.
fetch:
  enabled: false   # set true to enable fetch/download
  policy:
    domain_allow_list: []        # suffix match; empty = all domains allowed
    domain_deny_list: []         # suffix match; always wins over allow list
    allow_private_networks: false
  limits:
    max_bytes: 1048576
    timeout_seconds: 30

# Session todo list persisted to JSON (disabled by default).
todos:
  enabled: false   # set true to enable the todos tool
  path: ""         # default: ~/.task-relay/todos-<session>.json

# External pre-tool-use hooks; non-zero exit blocks the tool call (fail-closed).
hooks:
  pre_tool_use: []
  # pre_tool_use:
  #   - command: /usr/local/bin/deny-dangerous.sh
  #     timeout_seconds: 5
