# Unified master config for master-demo:
#   master-demo --config master.example.yaml --goal "..."
#   MASTER_CONFIG=master.example.yaml master-demo --goal "..."
#
# String fields support ${ENV_VAR} expansion.

hub:
  # Omit both grpc_addr and jwt for local-only mode.
  grpc_addr: ${HUB_GRPC_ADDR}
  jwt: ${MASTER_JWT}
  session: master-demo
  # tls:
  #   ca_file: ${HUB_TLS_CA}
  #   cert_file: ${HUB_TLS_CERT}
  #   key_file: ${HUB_TLS_KEY}
  #   skip_hostname_verify: false

openai:
  api_key: ${OPENAI_API_KEY}
  model: clint
  base_url: ${OPENAI_BASE_URL}
  # small_model: cheaper model for the local planner subagent (empty = reuse main model)
  small_model: ""

agent:
  mode: deep # deep | react
  max_iterations: 20
  # instruction: ""
  disable_local_subagents: false
  disable_local_planner: false

log:
  level: debug # debug|info|warn|error|off
  json: false
  verbose: false

runtime:
  timeout: 2m

metrics:
  enabled: false
  # addr: ":9090"

tracing:
  enabled: false
  # otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}

mcpServers:
  _example:
    disabled: true
    command: echo
    args: ["mcp-example-disabled"]

  # webextend:
  #   type: http
  #   url: http://127.0.0.1:8000/mcp
  #   headers:
  #     Authorization: Bearer ${GATEWAY_API_KEY}

search:
  enabled: true
  # Per-capability backends. Leave empty to use the priority fallback.
  search_backend: ""
  extract_backend: ""
  backend: ""
  max_results: 5
  timeout_seconds: 30

  providers:
    # Legacy self-hosted Tavily-compatible gateway (matches older single-provider configs).
    gateway:
      base_url: ${SEARCH_GATEWAY_BASE_URL}
      api_key: ${SEARCH_GATEWAY_API_KEY}
      timeout_seconds: 30

    # firecrawl:
    #   base_url: https://api.firecrawl.dev
    #   api_key: ${FIRECRAWL_API_KEY}
    #   timeout_seconds: 30

    # parallel:
    #   base_url: https://api.parallel.ai
    #   api_key: ${PARALLEL_API_KEY}
    #   timeout_seconds: 30

    # tavily:
    #   base_url: ${TAVILY_BASE_URL}
    #   api_key: ${TAVILY_API_KEY}
    #   search_depth: basic
    #   timeout_seconds: 30

    # perplexity:
    #   base_url: ${PERPLEXITY_BASE_URL}
    #   api_key: ${PERPLEXITY_API_KEY}
    #   timeout_seconds: 30

    # exa:
    #   base_url: https://api.exa.ai
    #   api_key: ${EXA_API_KEY}
