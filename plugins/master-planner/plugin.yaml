name: master-planner
label: Master Planner
kind: standalone
version: 0.1.0
description: >
  User-side Master Agent (planner) plugin: XHermes as an orchestration client
  for the inference platform. Registers eight gateway_* tools (dispatch /
  dispatch_batch / watch / get_result / list_tasks / list_models / list_workers /
  cancel) and dispatches subtasks to platform workers via Gateway-API
  AgentRelayService, watches the event stream (SSE, cursor resume), and
  aggregates results.

  Local ledger (sqlite, ~/.xhermes/master_planner.db) records run_id / task_id /
  cursor — the only reliable source for task state after context compaction or
  restart.

  Stdlib transport only (urllib + SSE), no third-party deps. All handlers are
  synchronous; watch loops poll interrupt every second; delegate_task child
  contexts are always rejected.
author: infa
# requires_env / optional_env are surfaced in the `xhermes config` UI via the
# env var injector in hermes_cli/config.py.
requires_env:
  - name: INFA_GATEWAY_API_KEY
    description: "Platform user API key for Gateway-API auth (Authorization: Bearer)."
    prompt: "INFA Gateway API Key"
    password: true
optional_env:
  - name: INFA_GATEWAY_BASE_URL
    description: "Gateway-API base URL. Default https://gateway.infa.example.com (placeholder — replace after deploy)."
    prompt: "INFA Gateway base URL (default https://gateway.infa.example.com)"
    password: false
  - name: INFA_GATEWAY_TIMEOUT_S
    description: "HTTP timeout in seconds for ordinary RPCs (default 30; watch streams use wait_seconds separately)."
    prompt: "INFA Gateway timeout seconds (default 30)"
    password: false
